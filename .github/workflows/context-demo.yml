name: Matrix Testing

on: workflow_dispatch

jobs:
  print-some-stuff:
    runs-on: ubuntu-latest
    steps:
    
      - name: Print som context
        run: |
          echo "Hello world, from our workflow"
          echo "Repository: ${{ github.action }}
          echo "Our env is: ${{ toJson(env) }}"
          echo "Our vars is: ${{ toJson(vars) }}"
          echo "Our matrix is: ${{ toJson(matrix) }}"
